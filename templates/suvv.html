
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sairaj Motors</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url("static/back.png") no-repeat center center/cover;
    min-height:100vh;
    position:relative;
}

/* Dark Overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(4,17,36,0.82);
    z-index:-1;
}

/* Heading */
.heading{
    text-align:center;
    color:#b2b508;
    font-size:45px;
    margin:40px 0;
    font-weight:bold;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    
}

/* Cards Container */
.car-container{
    width:90%;
    margin:auto;
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

/* Card */
.car-card{
    width:340px;
    background:url("static/back.png");
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:.4s;
}

.car-card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 40px rgba(20, 49, 154, 0.3);
}

.car-card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h2{
    color:#3d82ff;
    font-size:25px;
    margin-bottom:15px;
}

.price{
    color:#00e676;
    font-size:23px;
    font-weight:bold;
    margin-bottom:20px;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    color:#fff;
    font-size:15px;
}

.details span{
    display:flex;
    align-items:center;
    gap:8px;
}

/* Responsive */
@media(max-width:1100px){
    .car-container{
        gap:25px;
    }
}

@media(max-width:768px){
    .car-card{
        width:95%;
    }

    .heading{
        font-size:30px;
    }
}
</style>

</head>
<body>

<h1 class="heading">SUV COLLECTION</h1>

<div class="car-container">

    <!-- Card 1 -->
    <div class="car-card">
        <img src="static/scorpioN.jpg">
        <div class="content">
            <h2>Mahindra Scorpio N</h2>
            <div class="price">₹18,95,000</div>

            <div class="details">
                <span>📅 2025</span>
                <span>⛽ Diesel</span>
                <span>⚙ Manual/automatic</span>
                <span>🚗 21,000 KM</span>
            </div>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="car-card">
        <img src="static/fortuner2.jpg">
        <div class="content">
            <h2>Fortuner Legender</h2>
            <div class="price">₹48.92 Lakh</div>

            <div class="details">
                <span>📅 2025</span>
                <span>⛽ Diesel</span>
                <span>⚙ Auto</span>
                <span>🚗 1,000 KM</span>
            </div>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="car-card">
        <img src="static/thar.avif">
        <div class="content">
            <h2>Mahindra THAR 4x2</h2>
            <div class="price">₹13,50,000</div>

            <div class="details">
                <span>📅 2023</span>
                <span>⛽ Petrol/disel</span>
                <span>⚙ Automatic/manul</span>
                <span>🚗 8,500 KM</span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
